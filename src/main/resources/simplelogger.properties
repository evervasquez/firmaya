# El resumen para el usuario va por System.out; el registro solo debe aparecer si algo va mal.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true

# DSS avisa en WARN de cada certificado cuya cadena no puede validar contra una lista de
# confianza cargada. Aqui no cargamos ninguna a proposito (la confianza la decide el
# validador oficial), asi que ese aviso es ruido constante y tapa los mensajes utiles.
org.slf4j.simpleLogger.log.eu.europa.esig.dss.spi.validation.SignatureValidationContext=error
